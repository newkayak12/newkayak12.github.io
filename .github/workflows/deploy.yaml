# 모든 브랜치·PR에서 빌드하고 글을 점검한다(CI). master(push·예약·수동 실행)일 때만 GitHub Pages에 배포한다.
# 배포가 동작하려면 저장소 Settings → Pages → Source 를 "GitHub Actions"로 바꿔야 한다.
name: Build & Deploy

on:
  push:
  pull_request:
  workflow_dispatch:
  # 날짜가 미래인 글은 빌드에서 빠진다. 매일 00:05 KST에 다시 빌드해서 그날 글을 공개한다.
  schedule:
    - cron: '5 15 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: 글 점검 (페이지·이미지·렌더)
        run: npm run check:posts
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
